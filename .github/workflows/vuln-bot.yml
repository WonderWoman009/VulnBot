# .github/workflows/vuln-bot.yml

name: VulnBot - Security Alert Triage

on:
  schedule:
    - cron: '0 8 * * *'    # Every day 8am UTC
  workflow_dispatch:         # Manual trigger for testing

jobs:
  vuln-bot:
    runs-on: ubuntu-latest
    name: Scan and Create ADO Backlog

    steps:
      - name: Checkout VulnBot repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build VulnBot JAR
        working-directory: ./demo
        run: mvn clean package

      - name: Run VulnBot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ secrets.TARGET_REPO_NAME }}
          ADO_PAT: ${{ secrets.ADO_PAT }}
          ADO_ORG_URL: ${{ secrets.ADO_ORG_URL }}
          ADO_PROJECT: ${{ secrets.ADO_PROJECT }}
          ADO_AREA_PATH: ${{ secrets.ADO_AREA_PATH }}
          ADO_FEATURE_ID: ${{ secrets.ADO_FEATURE_ID }}
        run: |
          java -jar target/demo-0.0.1-SNAPSHOT.jar
